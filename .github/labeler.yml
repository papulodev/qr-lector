# Auto-label PRs based on changed files
# See https://github.com/actions/labeler

# Documentation
documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"
          - "docs/**"
          - "README*"
          - "CHANGELOG*"

# Dependencies
dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - "package.json"
          - "pnpm-lock.yaml"
          - ".github/dependabot.yml"

# CI / Build / Config
ci:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/workflows/**"
          - "vite.config.ts"
          - "tsconfig*.json"
          - "eslint.config.js"
          - ".prettierrc*"

# Tests
tests:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.test.ts"
          - "**/*.test.tsx"
          - "**/*.spec.ts"
          - "**/*.spec.tsx"
          - "vitest.config.ts"

# Types
types:
  - changed-files:
      - any-glob-to-any-file: "src/types/**"

# Utilities
utilities:
  - changed-files:
      - any-glob-to-any-file: "src/utils/**"

# Components
components:
  - changed-files:
      - any-glob-to-any-file: "src/components/**"

# Pages / Routing
pages:
  - changed-files:
      - any-glob-to-any-file: "src/pages/**"

# Hooks
hooks:
  - changed-files:
      - any-glob-to-any-file: "src/hooks/**"

# Styles
styles:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.css"
          - "**/*.scss"
          - "tailwind.config.*"

# App entry
app:
  - changed-files:
      - any-glob-to-any-file:
          - "src/main.tsx"
          - "src/App.tsx"
          - "index.html"

# Configuration files
config:
  - changed-files:
      - any-glob-to-any-file:
          - "*.config.*"
          - ".env*"
          - ".gitignore"
          - ".editorconfig"